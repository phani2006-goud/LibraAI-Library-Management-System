<!DOCTYPE html>
<html>
<head>
    <title>LibraAI - User Dashboard</title>
    <meta charset="UTF-8">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            background: #1e293b;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            padding: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .card button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="navbar">

    <h2>📚 LibraAI</h2>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</div>

<div class="container">

    <h1>Welcome to LibraAI 📚</h1>

    <p>Search books and find their rack and shelf location.</p>

    <div class="cards">

        <div class="card">
            <h3>🔎 Search Books</h3>
            <p>Search by title, author or category.</p>

            <button onclick="location.href='index.html#search'">
                Search Books
            </button>
        </div>

        <div class="card">
            <h3>📍 Find Rack</h3>
            <p>Find the rack and shelf of a book.</p>

            <button onclick="location.href='index.html#rack'">
                Find Rack
            </button>
        </div>

        <div class="card">
            <h3>📚 View Books</h3>
            <p>Browse available library books.</p>

            <button onclick="location.href='index.html#books'">
                View Books
            </button>
        </div>

    </div>

</div>

<script>
    function logout() {
        window.location.href = "logout";
    }
</script>

</body>
</html>
