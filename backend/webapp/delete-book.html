<!DOCTYPE html>
<html>
<head>
    <title>LibraAI - Delete Book</title>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .navbar {
            background: #1e293b;
            color: white;
            padding: 18px 30px;
        }

        .container {
            width: 400px;
            max-width: 90%;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background: #dc2626;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #b91c1c;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="navbar">
    <strong>📚 LibraAI Admin</strong>
</div>

<div class="container">

    <h1>🗑️ Delete Book</h1>

    <p>Enter the Book ID you want to delete.</p>

    <form action="delete-book" method="post">

        <label>Book ID</label>

        <input type="number"
               name="book_id"
               min="1"
               placeholder="Enter Book ID"
               required>

        <button type="submit"
                onclick="return confirm('Are you sure you want to delete this book?');">
            Delete Book
        </button>

    </form>

    <a class="back" href="admin.html">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
