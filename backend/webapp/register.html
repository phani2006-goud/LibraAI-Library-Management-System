
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | LibraAI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #23395d);
            color: #ffffff;
        }

        .register-container {
            width: 100%;
            max-width: 430px;
            padding: 30px;
            background: #ffffff;
            color: #222222;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            color: #183b65;
        }

        .subtitle {
            margin-bottom: 25px;
            text-align: center;
            color: #666666;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input:not([type="radio"]) {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #467bd0;
            border-color: #467bd0;
        }

        .account-options {
            display: flex;
            gap: 12px;
            margin: 10px 0 20px;
        }

        .account-option {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 14px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            cursor: pointer;
            background: #f8fafc;
        }

        .account-option input {
            margin: 0;
            accent-color: #2459a9;
        }

        .account-option:has(input:checked) {
            border: 2px solid #2459a9;
            background: #eaf2ff;
        }

        .hint {
            margin: -8px 0 18px;
            font-size: 12px;
            color: #666666;
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2459a9;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #183f7b;
        }

        .login-link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #2459a9;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>

    <main class="register-container">
        <h1>LibraAI</h1>

        <p class="subtitle">Create your library account</p>

        <form action="register" method="POST" id="registerForm">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                autocomplete="name"
                maxlength="100"
                required
            >

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                autocomplete="username"
                maxlength="50"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                maxlength="100"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="12"
                required
            >

            <p class="hint">
                Use at least 12 characters for your password.
            </p>

            <label>Choose Account Type</label>

            <div class="account-options">

                <label class="account-option">
                    <input
                        type="radio"
                        name="role"
                        value="USER"
                        checked
                    >
                    <span>👤 User Account</span>
                </label>

                <label class="account-option">
                    <input
                        type="radio"
                        name="role"
                        value="ADMIN"
                    >
                    <span>🔐 Admin Account</span>
                </label>

            </div>

            <div id="invitationSection" hidden>
                <label for="adminCode">Admin Invitation Code</label>

                <input
                    type="password"
                    id="adminCode"
                    name="adminCode"
                    placeholder="Enter admin invitation code"
                    autocomplete="off"
                >

                <p class="hint">
                    Admin registration requires a valid invitation code.
                </p>
            </div>

            <button type="submit">Create Account</button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>
    </main>

    <script>
        const roleOptions =
            document.querySelectorAll('input[name="role"]');

        const invitationSection =
            document.getElementById("invitationSection");

        const adminCode =
            document.getElementById("adminCode");

        function updateRoleFields() {
            const selectedRole =
                document.querySelector(
                    'input[name="role"]:checked'
                ).value;

            const isAdmin = selectedRole === "ADMIN";

            invitationSection.hidden = !isAdmin;
            adminCode.required = isAdmin;

            if (!isAdmin) {
                adminCode.value = "";
            }
        }

        roleOptions.forEach(function (option) {
            option.addEventListener("change", updateRoleFields);
        });

        updateRoleFields();
    </script>

</body>
</html>
