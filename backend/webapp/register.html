<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LibraAI Registration</title>
</head>
<body>

    <h2>Create Your LibraAI Account</h2>

    <form action="register" method="post">

        <label>Full Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Username:</label><br>
        <input type="text" name="username" required><br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>Password:</label><br>
        <input type="password" name="password"
               minlength="12" required><br><br>

        <label>Account Type:</label><br>
        <select name="role" id="role" required>
            <option value="USER">Normal User</option>
            <option value="ADMIN">Admin (Invitation Required)</option>
        </select><br><br>

        <div id="invitationSection" hidden>
            <label>Admin Invitation Code:</label><br>
            <input type="password" name="adminCode"
                   autocomplete="off"><br><br>
        </div>

        <button type="submit">Create Account</button>

    </form>

    <p>Already registered? <a href="login.html">Login</a></p>

    <script>
        const roleSelect = document.getElementById("role");
        const invitationSection =
            document.getElementById("invitationSection");
        const adminCode =
            document.querySelector('input[name="adminCode"]');

        function updateRoleFields() {
            const isAdmin = roleSelect.value === "ADMIN";
            invitationSection.hidden = !isAdmin;
            adminCode.required = isAdmin;
        }

        roleSelect.addEventListener("change", updateRoleFields);
        updateRoleFields();
    </script>

</body>
</html>
