<!DOCTYPE html>
<html>
<head>
    <title>LibraAI - Edit Book</title>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .navbar {
            background: #1e293b;
            color: white;
            padding: 18px 30px;
        }

        .container {
            width: 450px;
            max-width: 90%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="navbar">
    <strong>📚 LibraAI Admin</strong>
</div>

<div class="container">

    <h1>✏️ Edit Book</h1>

    <form action="edit-book" method="post">

        <label>Book ID</label>
        <input type="number" name="book_id" required>

        <label>Book Title</label>
        <input type="text" name="title" required>

        <label>Author</label>
        <input type="text" name="author" required>

        <label>Category</label>
        <input type="text" name="category" required>

        <label>Rack Number</label>
        <input type="text" name="rack_no" required>

        <label>Shelf Number</label>
        <input type="text" name="shelf_no" required>

        <label>Quantity</label>
        <input type="number" name="quantity" min="0" required>

        <button type="submit">Update Book</button>

    </form>

    <a class="back" href="admin.html">← Back to Dashboard</a>

</div>

</body>
</html>
